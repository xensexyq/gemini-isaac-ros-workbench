# Gemini 335L / 336L 的首次接入配置；连接后必须核对实际支持的 profile。
# 不修改固件，不开启交替投射模式。激光关闭，避免投射纹理干扰双目视觉。
camera_name: camera
uvc_backend: libuvc
enable_left_ir: true
enable_right_ir: true
left_ir_width: 640
left_ir_height: 480
left_ir_fps: 30
left_ir_format: Y8
right_ir_width: 640
right_ir_height: 480
right_ir_fps: 30
right_ir_format: Y8
depth_width: 640
depth_height: 480
depth_fps: 30
depth_format: Y16
depth_registration: false
enable_depth_scale: true
enable_point_cloud: false
enable_colored_point_cloud: false
enable_laser: false
interleave_frame_enable: false
enable_frame_sync: true
frame_aggregate_mode: full_frame
time_domain: global
timestamp_clock_type: realtime
enable_sync_host_time: false
publish_tf: true
tf_publish_rate: 0.0
enable_accel: true
enable_gyro: true
enable_sync_output_accel_gyro: true
accel_rate: 200hz
gyro_rate: 200hz
# 保留原始图像及其畸变参数，VSLAM 使用 rectified_images=false。
enable_left_ir_undistortion: false
enable_right_ir_undistortion: false
