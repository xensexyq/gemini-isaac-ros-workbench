      g.append(svg("path", {d: path, class: "hit"}), svg("path", {d: path, "marker-end": `url(#arrow-${e.kind})`}), svg("text", {x: lx, y: ly, "text-anchor": "middle"}, `${e.confidence === "inferred" ? "≈ " : e.confidence === "unknown" ? "？ " : ""}${e.label}`));
      activate(g, () => inspectEdge(e)); $("edges").append(g);
    }
    for (const n of model.nodes.filter(visible)) {
      const g = svg("g", {class: `node ${activeNodes.has(n.id) ? "active" : step ? "dim" : ""} ${state.selected === n.id ? "selected" : ""}`, transform: `translate(${n.x} ${n.y})`, "data-node-id": n.id, tabindex: "0", role: "button", "aria-label": `查看${n.label}`});
      g.append(svg("rect", {width: 200, height: 94}), svg("text", {x: 13, y: 19, class: "tag"}, `${kinds[n.kind]}${children(n.id).length ? ` · ${state.expanded.has(n.id) ? "已展开" : "可展开"}` : ""}`));
      const label = Array.from(n.label);
      g.append(svg("text", {x: 13, y: 40}, label.slice(0, 13).join("")));
      if (label.length > 13) g.append(svg("text", {x: 13, y: 58}, label.slice(13, 25).join("") + (label.length > 25 ? "…" : "")));
      g.append(svg("text", {x: 13, y: 80, class: "tag"}, confidence[n.confidence]));
      activate(g, () => inspectNode(n.id)); $("nodes").append(g);
    }
    transform();
  }
  function nodeButtons(ids, parent) {
    const nav = el("div", undefined, "node-nav");
    for (const id of ids) { const b = el("button", nodes.get(id).label); b.onclick = () => inspectNode(id, true); nav.append(b); }
    parent.append(nav);
  }
  function inspectNode(id, shouldReveal = false) {
    if (shouldReveal) { reveal(id); fit(); }
    state.selected = id;
    const n = nodes.get(id), panel = $("inspector"); panel.replaceChildren(el("h2", n.label), el("p", n.responsibility));
    claimNotes(n, panel);
    const child = children(id);
    if (child.length) {
      const button = el("button", state.expanded.has(id) ? "收起模块细节" : "展开模块细节");
      button.onclick = () => {
        if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
        inspectNode(id); fit();
      };
      panel.append(button); nodeButtons(child.map(n => n.id), panel);
    }
    const related = model.objects.filter(o => [...o.createdBy, ...o.readBy, ...o.writtenBy].includes(id));
    if (related.length) panel.append(el("h3", "关联业务对象"));
    for (const o of related) {
      const d = el("details"), names = ids => ids.map(id => nodes.get(id).label).join("、") || "未发现 / 不适用";
      d.append(el("summary", o.name), el("p", o.lifecycle));
      list("状态 / 阶段", o.states, d); list("对象关联", o.relations, d);
      d.append(el("p", `创建：${names(o.createdBy)}；读取：${names(o.readBy)}；写入：${names(o.writtenBy)}`));
      claimNotes(o, d); panel.append(d);
    }
    const links = model.edges.filter(e => e.from === id || e.to === id);
    if (links.length) panel.append(el("h3", "有方向的关系"));
    for (const e of links) { const button = el("button", `${nodes.get(e.from).label} → ${nodes.get(e.to).label} · ${e.label}`, "small"); button.onclick = () => inspectEdge(e); const row = el("div", undefined, "item"); row.append(button); panel.append(row); }
    draw();
  }
  function inspectEdge(e) {
    state.selected = null; draw();
    const p = $("inspector"); p.replaceChildren(el("h2", e.label), el("p", `${nodes.get(e.from).label} → ${nodes.get(e.to).label} · ${kinds[e.kind]}`));
    claimNotes(e, p); nodeButtons([e.from, e.to], p);
  }
  function showStep() {
    const p = $("step"), scene = model.scenarios[state.scene], step = currentStep();
    p.replaceChildren();
    $("prev").disabled = !scene || state.step < 0;
    $("next").disabled = !scene || state.step >= scene.steps.length - 1;
    $("progress").textContent = !scene ? "整体概览" : state.step < 0 ? `场景概览 · ${scene.steps.length} 步` : `${state.step + 1} / ${scene.steps.length}`;
    if (!scene) { p.append(el("p", "先看整体架构，再选择关键场景逐步探索。")); draw(); return; }
    if (!step) { p.append(el("h2", scene.title), el("p", `触发：${scene.trigger}`), el("p", `最终结果：${scene.outcome}`)); draw(); return; }
    step.nodes.forEach(reveal);
    p.append(el("h2", step.title), el("p", step.explanation));
    list("数据变化 / 读取", step.data, p); p.append(el("p", `本步结果：${step.result}`));
    list("失败处理 / 重试 / 分支", step.branches, p); claimNotes(step, p);
    draw(); fit();
  }
  $("title").textContent = `${model.project.name} · 架构与运行流程`;
  $("summary").textContent = model.project.summary;
  $("snapshot").textContent = `根目录：${model.project.root}\n分支：${model.project.branch}\nHEAD：${model.project.head}\n工作区：${model.project.dirty ? "有未提交改动；以检查时的实际文件为准" : "干净"}\n检查时间：${model.project.inspectedAt}\n${(model.project.scopeNotes || []).join("\n")}`;
  $("scenario").append(new Option("整体概览", "-1"));
  model.scenarios.forEach((s, i) => $("scenario").append(new Option(s.title, String(i))));
  $("scenario").onchange = () => { state.scene = Number($("scenario").value); state.step = -1; showStep(); };
  $("prev").onclick = () => { state.step--; showStep(); };
  $("next").onclick = () => { state.step++; showStep(); };
  $("zoom-in").onclick = () => zoom(1.2); $("zoom-out").onclick = () => zoom(1 / 1.2);
  $("reset").onclick = fit;
  $("overview").onclick = () => { state.expanded.clear(); state.scene = state.step = -1; state.selected = null; $("scenario").value = "-1"; $("inspector").replaceChildren(el("h2", "模块详情"), el("p", "点击节点查看职责、关联对象与代码位置。")); showStep(); fit(); };
  $("canvas").addEventListener("wheel", event => { event.preventDefault(); const r = $("canvas").getBoundingClientRect(); zoom(Math.exp(-event.deltaY * .001), event.clientX - r.left, event.clientY - r.top); }, {passive: false});
  let drag = null;
  $("canvas").addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest(".node,.edge")) return;
    drag = {x: event.clientX, y: event.clientY}; $("canvas").setPointerCapture(event.pointerId);
  });
  $("canvas").addEventListener("pointermove", event => { if (!drag) return; state.x += event.clientX - drag.x; state.y += event.clientY - drag.y; drag = {x: event.clientX, y: event.clientY}; transform(); });
  for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) $("canvas").addEventListener(event, () => { drag = null; });
  for (const u of model.uncertainties) { const row = el("div", undefined, "item"); row.append(el("h3", u.topic), el("p", u.detail), el("p", `所需证据：${u.neededEvidence}`)); $("uncertainties").append(row); }
  if (!model.uncertainties.length) $("uncertainties").append(el("p", "本次分析范围内未列出额外待核实项；不代表运行时已验收。"));
  for (const d of model.docDifferences) { const row = el("div", undefined, "item"); row.append(el("p", `文档：${d.documentation}`), el("p", `实现：${d.implementation}`)); proofs(d.evidence, row); $("differences").append(row); }
  if (!model.docDifferences.length) $("differences").append(el("p", "检查范围内未发现文档与实现差异。"));
  $("download").onclick = () => { const url = URL.createObjectURL(new Blob([JSON.stringify(model, null, 2)], {type: "application/json"})); const a = el("a"); a.href = url; a.download = "architecture.json"; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  window.addEventListener("resize", fit);
  showStep(); fit();
})();
</script>
